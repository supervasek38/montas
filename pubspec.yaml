name: montas_prototype
description: Interactive MONTAS home, recovery plan and specialist prototype from Figma.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.0
  web: ^1.1.1
  archive: ^3.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/events/
    - assets/market/
    - assets/radar/
    - assets/anna-demo.png
    - assets/ambient.svg
    - assets/portrait-head.svg
    - assets/portrait-accent.svg
  fonts:
    - family: Onest
      fonts:
        - asset: assets/Onest.ttf
    - family: Manrope
      fonts:
        - asset: assets/Manrope.ttf

